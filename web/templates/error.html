{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% macro body() %}
  <div class="error-page">
    <div class="error-code">{{ code }}</div>
    <h1>{{ title }}</h1>
    {%- if message %}<p class="muted">{{ message }}</p>{% endif %}
    <a class="btn btn-primary" href="{{ url_for('main.dashboard') }}">На главную</a>
  </div>
{% endmacro %}
{% block guest %}<main class="login-page">{{ body() }}</main>{% endblock %}
{% block content %}{{ body() }}{% endblock %}
